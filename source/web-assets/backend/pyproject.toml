[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-vibez-backend"
version = "1.0.0"
description = "Global Vibez DSG FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pymongo>=4.10,<5.0",
    "motor>=3.6,<4.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "python-multipart>=0.0.12,<1.0",
    "python-socketio>=5.11,<6.0",
    "aiohttp>=3.9,<4.0",
    "requests>=2.32,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "email-validator>=2.2,<3.0",
    "boto3>=1.35,<2.0",
    "chess>=1.10,<2.0",
    "Pillow>=10.4,<11.0",
    "numpy>=1.26,<2.0",
    "openai>=1.60,<2.0",
    "edge-tts>=7.0,<8.0",
    "httpx>=0.27,<1.0",
    "stripe>=11.0,<12.0",
    "solana>=0.35,<1.0",
    "solders>=0.23,<1.0",
    "base58>=2.1,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "flake8>=7.0", "black>=24.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["routes*", "utils*", "logic*", "models*", "services*", "tests*"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
