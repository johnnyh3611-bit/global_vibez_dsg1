name: Deploy Global Vibez DSG
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Build Frontend
        run: |
          npm install --legacy-peer-deps
          npm run build
      - name: Deploy to Azure
        uses: appleboy/scp-action@master
        with:
          host: 20.84.123.232
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "source/scripts/build/*"
          target: "~/master-project/"
      - name: Restart Nginx
        uses: appleboy/ssh-action@master
        with:
          host: 20.84.123.232
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo rm -rf /var/www/html/*
            sudo cp -r ~/master-project/source/scripts/build/* /var/www/html/
            sudo service nginx restart
