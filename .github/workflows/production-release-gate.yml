name: Production Release Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-api:
    runs-on: ubuntu-latest
    outputs:
      backend_url: ${{ steps.resolve.outputs.backend_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve backend URL
        id: resolve
        run: |
          set -euo pipefail
          backend_url="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('vercel.json').read_text())
          print((data.get('env') or {}).get('REACT_APP_BACKEND_URL', '').strip())
          PY
          )"
          if [[ -z "$backend_url" ]]; then
            echo "REACT_APP_BACKEND_URL is empty in vercel.json"
            exit 1
          fi
          echo "backend_url=$backend_url" >> "$GITHUB_OUTPUT"

  vercel-runtime-checks:
    name: Vercel runtime checks
    runs-on: ubuntu-latest
    needs: resolve-api
    env:
      REACT_APP_BACKEND_URL: ${{ needs.resolve-api.outputs.backend_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Domain routing check
        run: npm run domain:check

      - name: Full smoke test (www + API)
        run: npm run smoke:full

  railway-health-checks:
    name: Railway health checks
    runs-on: ubuntu-latest
    needs: resolve-api
    env:
      REACT_APP_BACKEND_URL: ${{ needs.resolve-api.outputs.backend_url }}
    steps:
      - name: Check /health
        run: |
          set -euo pipefail
          curl -fsS "${REACT_APP_BACKEND_URL%/}/health" >/tmp/railway-health.json
          python3 - <<'PY'
          import json
          import pathlib
          payload = json.loads(pathlib.Path('/tmp/railway-health.json').read_text())
          if payload.get('status') != 'ok':
            raise SystemExit(f"Unexpected health payload: {payload}")
          print("Railway /health returned status=ok")
          PY
